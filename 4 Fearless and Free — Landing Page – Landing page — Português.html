  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

D9E2E6; text-decoration: none; padding: 10px 0\">O guia<\u002Fa>\n<a href=\"#produtos\" style=\"color: #D9E2E6; text-decoration: none; padding: 10px 0\">Produtos<\u002Fa>\n<a href=\"#historia\" style=\"color: #D9E2E6; text-decoration: none; padding: 10px 0\">A nossa história<\u002Fa>\n<a href=\"#perguntas\" style=\"color: #D9E2E6; text-decoration: none; padding: 10px 0\">Perguntas<\u002Fa>\n<a href=\"#comprar\" style=\"background: {{accent}}; color: #14232C; text-decoration: none; font-weight: 700; padding: 12px 20px; border-radius: 999px\">Comprar o guia<\u002Fa>\n<\u002Fdiv>\n<\u002Fnav>\n\n<!-- HERO -->\n<section id=\"topo\" style=\"max-width: 1200px; margin: 0 auto; padding: 56px 24px 96px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 24px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #F2A97E\">Uma família portuguesa · do outro lado do mundo<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(44px, 6vw, 84px); line-height: 0.98; letter-spacing: -0.03em\">Do Sonho<br>à Austrália<\u002Fh1>\n<p style=\"margin: 0; font-size: 20px; line-height: 1.55; color: #D9E2E6; max-width: 34ch\">O guia real para famílias portuguesas que querem começar uma nova vida na Austrália — escrito por quem fez a mudança com duas crianças.<\u002Fp>\n<div style=\"display: flex; flex-wrap: wrap; gap: 12px; align-items: center\">\n<a href=\"#comprar\" style=\"background: {{accent}}; color: #14232C; text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 28px; border-radius: 999px; min-height: 44px; box-sizing: border-box\">Quero o guia — €19,90<\u002Fa>\n<a href=\"#gratis\" style=\"color: #F7F2EA; text-decoration: none; font-weight: 600; font-size: 17px; padding: 15px 26px; border-radius: 999px; border: 1.5px solid #5D7682; min-height: 44px; box-sizing: border-box\">Checklist gratuito<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #B9C6CC\">Preço de lançamento · depois €24,90 · PDF para descarregar de imediato<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"aspect-ratio: 4 / 5; border-radius: 28px; background: #1E4352; display: flex; align-items: flex-end; padding: 24px; box-sizing: border-box; overflow: hidden\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #F2A97E\">Fotografia<\u002Fspan>\n<span style=\"font-size: 16px; color: #D9E2E6\">[A família numa praia de Perth ao pôr do sol]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fheader>\n\n<!-- TRUST STRIP -->\n<section aria-label=\"A nossa experiência\" style=\"background: #E9DFCF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; letter-spacing: -0.01em\">6 meses<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">de preparação antes de partir<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; letter-spacing: -0.01em\">2 crianças<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">a adaptar-se a um novo país<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; letter-spacing: -0.01em\">Do zero<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">sem casa, emprego ou escola à chegada<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- EMPATHY -->\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 48px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.025em\">Emigrar é uma das maiores decisões da vossa vida.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #3D4A52\">Há muita informação solta na internet. O que falta é alguém que já passou por isso e vos conte, com honestidade, como é realmente — os planos, os medos, os custos e as vitórias.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A8461C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M9 13h6M9 17h4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em\">«Por onde começo?»<\u002Fh3>\n<p style=\"margin: 0; color: #3D4A52\">Documentos, prazos e decisões que parecem intermináveis. Organizámos tudo pela ordem em que o vivemos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A8461C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v11\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em\">«Quanto vai custar?»<\u002Fh3>\n<p style=\"margin: 0; color: #3D4A52\">Os custos que aparecem nos sites — e os que ninguém vos conta até já estarem a pagar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#A8461C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em\">«E os miúdos?»<\u002Fh3>\n<p style=\"margin: 0; color: #3D4A52\">Como preparámos os nossos filhos, o que correu bem, o que custou mais e o que faríamos diferente.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- WHAT'S INSIDE -->\n<section id=\"guia\" style=\"max-width: 1200px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px\">\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #A8461C\">Dentro do guia<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.025em\">Tudo o que gostávamos de ter sabido antes de partir.<\u002Fh2>\n<p style=\"margin: 0; color: #3D4A52; font-size: 18px\">Um guia com fotografias nossas, experiência pessoal, exemplos reais e checklists práticos — para lerem ao vosso ritmo e voltarem sempre que precisarem.<\u002Fp>\n<div style=\"aspect-ratio: 4 / 3; border-radius: 22px; background: #E9DFCF; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box\">\n<span style=\"font-size: 15px; color: #4A5A62\">[Mockup das páginas do guia]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"flex: 1 1 480px; min-width: 0; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px\">\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">01<\u002Fspan><strong style=\"font-size: 18px\">Como começou a decisão<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">O momento em que o sonho passou a plano.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">02<\u002Fspan><strong style=\"font-size: 18px\">Os seis meses de preparação<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">O nosso calendário, mês a mês.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">03<\u002Fspan><strong style=\"font-size: 18px\">O que tratar antes de viajar<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">Papéis, contas, casa e despedidas.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">04<\u002Fspan><strong style=\"font-size: 18px\">Chegar sem casa, emprego ou escola<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">As primeiras semanas, sem filtros.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">05<\u002Fspan><strong style=\"font-size: 18px\">Adaptar crianças a um novo país<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">Escola, amizades, língua e saudade.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">06<\u002Fspan><strong style=\"font-size: 18px\">Custos que ninguém vos conta<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">O que gastámos de facto.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">07<\u002Fspan><strong style=\"font-size: 18px\">Erros, surpresas e aprendizagens<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">Para não repetirem os nossos.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">08<\u002Fspan><strong style=\"font-size: 18px\">Checklist para preparar a mudança<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">Pronto a imprimir e riscar.<\u002Fspan><\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<!-- BUY -->\n<section id=\"comprar\" style=\"background: #0F2A36; color: #F7F2EA\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 56px\">\n<div style=\"flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 18px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #F2A97E\">O guia principal<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.025em\">Do Sonho à Austrália<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #D9E2E6\">O Guia Real de uma Família Portuguesa. A nossa história, organizada para vos ajudar a preparar a vossa.<\u002Fp>\n<ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 10px; color: #D9E2E6\">\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F2A97E\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>8 capítulos com a nossa experiência real<\u002Fli>\n<li style=\"display: flex; gap: 12px; align-items: flex-start\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#F2A97E\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"flex: none; margin-top: 3px\"><path d=\"M5 12.5l4.5 4.5L19 7.5\"><\u002Fpath><\u002Fsvg>Checklist de preparação para imprimir<\u002Fli>\n<li styl ; gap: 12px; align-items: center\">\n<a href=\"#comprar\" style=\"background: #F2A97E; color: #14232C; text-decoration: none; font-weight: 700; font-size: 17px; padding: 16px 28px; border-radius: 999px; min-height: 44px; box-sizing: border-box\">Quero o guia — €19,90<\u002Fa>\n<a href=\"#gratis\" style=\"color: #F7F2EA; text-decoration: none; font-weight: 600; font-size: 17px; padding: 15px 26px; border-radius: 999px; border: 1.5px solid #5D7682; min-height: 44px; box-sizing: border-box\">Checklist gratuito<\u002Fa>\n<\u002Fdiv>\n<p style=\"margin: 0; font-size: 14px; color: #B9C6CC\">Preço de lançamento · depois €24,90 · PDF para descarregar de imediato<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px\">\n<div style=\"aspect-ratio: 4 / 5; border-radius: 28px; background: #1E4352; display: flex; align-items: flex-end; padding: 24px; box-sizing: border-box; overflow: hidden\">\n<div style=\"display: flex; flex-direction: column; gap: 6px\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #F2A97E\">Fotografia<\u002Fspan>\n<span style=\"font-size: 16px; color: #D9E2E6\">[A família numa praia de Perth ao pôr do sol]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n<\u002Fheader>\n\n\n<section aria-label=\"A nossa experiência\" style=\"background: #E9DFCF\">\n<div style=\"max-width: 1200px; margin: 0 auto; padding: 28px 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px 40px\">\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; letter-spacing: -0.01em\">6 meses<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">de preparação antes de partir<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; letter-spacing: -0.01em\">2 crianças<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">a adaptar-se a um novo país<\u002Fspan><\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 2px\"><strong style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 26px; letter-spacing: -0.01em\">Do zero<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">sem casa, emprego ou escola à chegada<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"max-width: 1200px; margin: 0 auto; padding: 96px 24px 48px; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-direction: column; gap: 16px; max-width: 760px\">\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.025em\">Emigrar é uma das maiores decisões da vossa vida.<\u002Fh2>\n<p style=\"margin: 0; font-size: 19px; color: #3D4A52\">Há muita informação solta na internet. O que falta é alguém que já passou por isso e vos conte, com honestidade, como é realmente — os planos, os medos, os custos e as vitórias.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px\">\n<div style=\"background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A8461C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z\"><\u002Fpath><path d=\"M14 3v5h5\"><\u002Fpath><path d=\"M9 13h6M9 17h4\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em\">«Por onde começo?»<\u002Fh3>\n<p style=\"margin: 0; color: #3D4A52\">Documentos, prazos e decisões que parecem intermináveis. Organizámos tudo pela ordem em que o vivemos.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A8461C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M15 9.5c-.5-1-1.6-1.5-3-1.5-1.7 0-3 .9-3 2s1.3 1.7 3 2 3 .9 3 2-1.3 2-3 2c-1.4 0-2.5-.5-3-1.5M12 6.5v11\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em\">«Quanto vai custar?»<\u002Fh3>\n<p style=\"margin: 0; color: #3D4A52\">Os custos que aparecem nos sites — e os que ninguém vos conta até já estarem a pagar.<\u002Fp>\n<\u002Fdiv>\n<div style=\"background: #FFFFFF; border-radius: 22px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#A8461C\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21l7.8-7.5 1-1.1a5.5 5.5 0 0 0 0-7.8z\"><\u002Fpath><\u002Fsvg>\n<h3 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-size: 22px; letter-spacing: -0.01em\">«E os miúdos?»<\u002Fh3>\n<p style=\"margin: 0; color: #3D4A52\">Como preparámos os nossos filhos, o que correu bem, o que custou mais e o que faríamos diferente.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"guia\" style=\"max-width: 1200px; margin: 0 auto; padding: 48px 24px 96px; display: flex; flex-wrap: wrap; gap: 56px\">\n<div style=\"flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: #A8461C\">Dentro do guia<\u002Fp>\n<h2 style=\"margin: 0; font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.025em\">Tudo o que gostávamos de ter sabido antes de partir.<\u002Fh2>\n<p style=\"margin: 0; color: #3D4A52; font-size: 18px\">Um guia com fotografias nossas, experiência pessoal, exemplos reais e checklists práticos — para lerem ao vosso ritmo e voltarem sempre que precisarem.<\u002Fp>\n<div style=\"aspect-ratio: 4 / 3; border-radius: 22px; background: #E9DFCF; display: flex; align-items: flex-end; padding: 20px; box-sizing: border-box\">\n<span style=\"font-size: 15px; color: #4A5A62\">[Mockup das páginas do guia]<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<ol style=\"flex: 1 1 480px; min-width: 0; margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px\">\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">01<\u002Fspan><strong style=\"font-size: 18px\">Como começou a decisão<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">O momento em que o sonho passou a plano.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">02<\u002Fspan><strong style=\"font-size: 18px\">Os seis meses de preparação<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">O nosso calendário, mês a mês.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">03<\u002Fspan><strong style=\"font-size: 18px\">O que tratar antes de viajar<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">Papéis, contas, casa e despedidas.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">04<\u002Fspan><strong style=\"font-size: 18px\">Chegar sem casa, emprego ou escola<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">As primeiras semanas, sem filtros.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">05<\u002Fspan><strong style=\"font-size: 18px\">Adaptar crianças a um novo país<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">Escola, amizades, língua e saudade.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">06<\u002Fspan><strong style=\"font-size: 18px\">Custos que ninguém vos conta<\u002Fstrong><span style=\"font-size: 15px; color: #4A5A62\">O que gastámos de facto.<\u002Fspan><\u002Fli>\n<li style=\"background: #FFFFFF; border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 6px\"><span style=\"font-family: 'Bricolage Grotesque', system-ui, sans-serif; font-weight: 800; color: #A8461C; font-size: 15px\">07<\u002Fspan><strong style=\"font-size: 18px\">Erros, surpresas e aprendizagens<\u002
